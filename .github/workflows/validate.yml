name: Validate organization standards

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  repository-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate JSON and copied templates
        run: |
          python3 -m json.tool tool-versions.json >/dev/null
          python3 scripts/check-template-sync.py
