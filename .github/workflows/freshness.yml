name: Upstream version freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  check-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pinned scanner/action releases with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-freshness.py
